events {}
http {
  upstream gateways {
    server gateway:8080;   # Docker DNS returns every replica; nginx round-robins across them
  }
  server {
    listen 80;
    location / {
      proxy_pass http://gateways;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, so clients cannot spoof their IP
    }
  }
}
